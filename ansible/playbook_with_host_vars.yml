- hosts: webservers
  become: yes

  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: "{{ nginx_version }}"
      tags: install

    - name: Create web root directory
      ansible.builtin.file:
        path: "{{ root_dir }}"
        state: directory
        mode: '0755'
      tags: setup

    - name: Copy index.html file from template
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ root_dir }}/{{ index_file }}"
      notify:
        - restart nginx
      tags: content

    - name: Update nginx configuration with template
      ansible.builtin.template:
        src: files/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify:
        - restart nginx
      tags: config

  handlers:
    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
