- hosts: webservers
  become: yes
  vars:
    nginx_port: 8090
    root_dir: /var/tmp/www

  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: latest
      tags: install

    - name: Create web root directory
      ansible.builtin.file:
        path: "{{ root_dir }}"
        state: directory
        mode: '0755'
      tags: setup

    - name: Copy index.html file
      ansible.builtin.template:
        src: files/index.html
        dest: "{{ root_dir }}/index.html"
      notify:
        - restart nginx
      tags: content

    - name: Update nginx configuration with template
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify:
        - restart nginx
      tags: config

  handlers:
    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted